name: Bot Calcio Live 24-7

on:
  schedule:
    # Esegue il bot ogni 5 minuti
    - cron: '*/5 * * * *'
  workflow_dispatch: # Ti permette di avviarlo anche manualmente da GitHub quando vuoi

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui il Bot
        run: python tuonomefile.py
